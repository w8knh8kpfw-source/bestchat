databases:
  - name: bestchat-db
    databaseName: bestchat_db
    user: bestchat_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: 17
services:
  - type: web
    name: bestchat
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bestchat-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
